<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AmazonPage Static Site Index</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #24292f;
      --muted: #57606a;
      --border: #d0d7de;
      --link: #0969da;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 24px;
    }
    p {
      margin: 0 0 18px 0;
      color: var(--muted);
    }
    ul {
      margin: 0;
      padding-left: 18px;
    }
    li {
      margin: 8px 0;
    }
    a {
      color: var(--link);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>AmazonPage</h1>
      <p>这个仓库用于统一托管多个静态页面。以下是当前可访问页面：</p>
      <ul>
        <li><a href="./fba-advisor-page/">FBA 售后功能顾问页</a></li>
              <li><a href="./fba-toolkit-page/">FBA 卖家增长工具箱 — 四大功能降本增效</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
